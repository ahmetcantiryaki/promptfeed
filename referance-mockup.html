<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PromptFeed — AI İçerik Keşif Platformu</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #18181b;
    --text-muted: #71717a;
    --text-subtle: #a1a1aa;
    --label: #a1a1aa;
    --accent: #18181b;
    --accent-fg: #ffffff;
    --hover: #f4f4f5;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
    --radius: 10px;
    --radius-sm: 6px;
  }
  [data-theme="dark"] {
    --bg: #0a0a0a;
    --surface: #111113;
    --surface-2: #18181b;
    --border: #27272a;
    --border-strong: #3f3f46;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --text-subtle: #71717a;
    --label: #71717a;
    --accent: #fafafa;
    --accent-fg: #0a0a0a;
    --hover: #1c1c1f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ LAYOUT ============ */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 20px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px;
    margin-bottom: 4px;
  }
  .logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-fg);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
  }
  .logo-text { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }

  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--label);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0 8px;
    margin-bottom: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.12s ease;
    text-decoration: none;
  }
  .nav-item:hover { background: var(--hover); color: var(--text); }
  .nav-item.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
  .nav-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item .label { flex: 1; }
  .nav-item .count {
    font-size: 11px;
    color: var(--text-subtle);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px 8px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-subtle);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sidebar-footer a { color: inherit; text-decoration: none; }
  .sidebar-footer a:hover { color: var(--text); }

  /* ============ MAIN ============ */
  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* ============ TOPBAR ============ */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    transition: border-color 0.12s;
  }
  .search:focus-within { border-color: var(--border-strong); }
  .search input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .search input::placeholder { color: var(--text-subtle); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn:hover { background: var(--hover); }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }
  .btn-primary:hover { opacity: 0.9; background: var(--accent); }

  .icon-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.12s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  /* ============ FILTER BAR ============ */
  .filterbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
  }
  .tab:hover { background: var(--hover); color: var(--text); }
  .tab.active {
    background: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
  }
  .dropdown {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s;
  }
  .dropdown:hover { background: var(--hover); color: var(--text); }
  .dropdown .chev { opacity: 0.5; }

  .filterbar-spacer { flex: 1; }

  .grid-size-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .grid-size-label {
    font-size: 12px;
    color: var(--text-subtle);
    font-weight: 500;
  }
  .grid-size {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .grid-size button {
    width: 34px; height: 32px;
    display: grid; place-items: center;
    background: var(--surface);
    border: none;
    border-right: 1px solid var(--border);
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.12s;
  }
  .grid-size button:last-child { border-right: none; }
  .grid-size button:hover { background: var(--hover); color: var(--text); }
  .grid-size button.active { background: var(--surface-2); color: var(--text); }

  /* ============ GRID ============ */
  .feed {
    padding: 24px 28px 40px;
  }
  .grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(4, 1fr);
  }
  .grid[data-cols="2"] { grid-template-columns: repeat(2, 1fr); }
  .grid[data-cols="3"] { grid-template-columns: repeat(3, 1fr); }
  .grid[data-cols="4"] { grid-template-columns: repeat(4, 1fr); }
  .grid[data-cols="5"] { grid-template-columns: repeat(5, 1fr); }

  /* ============ CARD ============ */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover {
    border-color: var(--border-strong);
  }
  .card-media {
    position: relative;
    aspect-ratio: 16 / 10;
    background: var(--surface-2);
    overflow: hidden;
  }
  .card-media svg, .card-media .media-inner {
    width: 100%;
    height: 100%;
    display: block;
  }
  .play-indicator {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .play-indicator div {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    display: grid;
    place-items: center;
    color: white;
  }

  .card-body {
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .user {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--surface-2);
  }
  .username {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .platform-info {
    text-align: right;
    font-size: 12px;
    line-height: 1.3;
    flex-shrink: 0;
  }
  .platform-name { color: var(--text); font-weight: 500; }
  .platform-time { color: var(--text-subtle); }

  .field { display: flex; flex-direction: column; gap: 3px; }
  .field-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--label);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .field-value { font-size: 13px; color: var(--text); font-weight: 500; }
  .prompt-text {
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }
  .action {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s;
    background: transparent;
    border: none;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }
  .action:hover { background: var(--hover); color: var(--text); }
  .actions-spacer { flex: 1; }

  /* ============ SMALL LOGOS INSIDE LIST ============ */
  .brand-square {
    width: 22px; height: 22px;
    border-radius: 5px;
    background: var(--surface-2);
    display: grid;
    place-items: center;
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  /* ============ SCROLLBAR ============ */
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  /* ============ RESPONSIVE (minimal — desktop first) ============ */
  @media (max-width: 1200px) {
    .grid[data-cols="5"] { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .grid, .grid[data-cols="4"], .grid[data-cols="5"] { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

  // ============ AVATAR PLACEHOLDER ============
  function avatarSVG(seed, idx) {
    const colors = [
      ["#fbbf24","#f97316"], ["#60a5fa","#8b5cf6"], ["#34d399","#0ea5e9"],
      ["#f472b6","#ec4899"], ["#a78bfa","#6366f1"], ["#fb7185","#f59e0b"],
      ["#14b8a6","#84cc16"], ["#06b6d4","#8b5cf6"]
    ];
    const [c1, c2] = colors[idx % colors.length];
    const id = `av${idx}`;
    return `<svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs>
      <rect width="26" height="26" fill="url(#${id})" rx="13"/>
    </svg>`;
  }

  // ============ RENDER ============
  function renderCards() {
    const grid = document.getElementById('grid');
    grid.innerHTML = cards.map((c, i) => `
      <article class="card">
        <div class="card-media">
          <div class="media-inner">${sceneSVG(c.scene, c.gradient, i)}</div>
          ${c.video ? `<div class="play-indicator"><div>${ICON.play}</div></div>` : ''}
        </div>
        <div class="card-body">
          <div class="meta-row">
            <div class="user">
              <div class="avatar">${avatarSVG(c.user, i)}</div>
              <span class="username">${c.user}</span>
            </div>
            <div class="platform-info">
              <div class="platform-name">${c.platform}</div>
              <div class="platform-time">${c.time}</div>
            </div>
          </div>
          <div class="field">
            <div class="field-label">Model</div>
            <div class="field-value">${c.model}</div>
          </div>
          <div class="field">
            <div class="field-label">Prompt</div>
            <div class="prompt-text">${c.prompt}</div>
          </div>
        </div>
        <div class="actions">
          <button class="action">${ICON.heart}<span>${c.likes}</span></button>
          <button class="action">${ICON.comment}<span>${c.comments}</span></button>
          <button class="action">${ICON.share}<span>${c.shares}</span></button>
          <div class="actions-spacer"></div>
          <button class="action">${ICON.more}</button>
        </div>
      </article>
    `).join('');
  }
  renderCards();

  // ============ GRID SIZE ============
  const gridSize = document.getElementById('gridSize');
  const grid = document.getElementById('grid');
  gridSize.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const cols = btn.dataset.cols;
    if (!cols) return;
    [...gridSize.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b === btn));
    grid.dataset.cols = cols;
    localStorage.setItem('pf_cols', cols);
  });
  const savedCols = localStorage.getItem('pf_cols');
  if (savedCols) {
    grid.dataset.cols = savedCols;
    [...gridSize.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b.dataset.cols === savedCols));
  }

  // ============ THEME TOGGLE ============

  const sunIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
  const moonIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    themeToggle.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
    localStorage.setItem('pf_theme', theme);
  }
  const savedTheme = localStorage.getItem('pf_theme') || 'light';
  applyTheme(savedTheme);
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.dataset.theme;
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
